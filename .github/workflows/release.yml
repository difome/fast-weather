name: Build & Publish Release APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        if: "${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}"
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Build Release APK
        env:
          CI: "true"
          KEYSTORE_FILE_PATH: "release.jks"
          KEYSTORE_PASSWORD: "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}"
          KEY_ALIAS: "${{ secrets.RELEASE_KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.RELEASE_KEY_PASSWORD }}"
        run: ./gradlew assembleRelease --stacktrace

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "FastWeather v1.0.${{ github.run_number }}"
          body: |
            ## FastWeather Automatic Release
            - Built automatically on push to `${{ github.ref_name }}`
            - Signed Release APK
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

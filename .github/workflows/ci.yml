name: Android CI (PR & Contributor Check)

on:
  pull_request:
    branches:
      - master

jobs:
  check-pr:
    name: Build & Test Contributor PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK & Run Tests
        run: ./gradlew assembleDebug test --stacktrace
